<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="txs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="txs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="txs-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2230" />
      <stop offset="100%" stop-color="#0D0F15" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#txs-bg)" stroke="url(#txs-border)" stroke-width="12" />

  <!-- Circuit Trace Pattern Left -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 64 160 L 128 160 L 160 192 L 160 256" />
    <circle cx="64" cy="160" r="6" fill="#38BDF8" />
    <path d="M 64 352 L 128 352 L 160 320 L 160 280" />
    <circle cx="64" cy="352" r="6" fill="#38BDF8" />
  </g>

  <!-- Circuit Trace Pattern Right -->
  <g stroke="#F59E0B" stroke-opacity="0.35" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 448 160 L 384 160 L 352 192 L 352 240" />
    <circle cx="448" cy="160" r="6" fill="#F59E0B" />
    <path d="M 448 352 L 384 352 L 352 320 L 352 272" />
    <circle cx="448" cy="352" r="6" fill="#F59E0B" />
  </g>

  <!-- CPU Socket Pin Headers (Top & Bottom) -->
  <g fill="#F59E0B" opacity="0.85">
    <rect x="176" y="80" width="16" height="24" rx="4" />
    <rect x="216" y="80" width="16" height="24" rx="4" />
    <rect x="256" y="80" width="16" height="24" rx="4" />
    <rect x="296" y="80" width="16" height="24" rx="4" />
    <rect x="336" y="80" width="16" height="24" rx="4" />

    <rect x="176" y="408" width="16" height="24" rx="4" />
    <rect x="216" y="408" width="16" height="24" rx="4" />
    <rect x="256" y="408" width="16" height="24" rx="4" />
    <rect x="296" y="408" width="16" height="24" rx="4" />
    <rect x="336" y="408" width="16" height="24" rx="4" />
  </g>

  <!-- Inner Silicon Wafer Shield -->
  <rect x="112" y="112" width="288" height="288" rx="40" fill="url(#txs-core)" stroke="#38BDF8" stroke-width="5" stroke-opacity="0.7" />

  <!-- Corner Notch Hardware Accents -->
  <path d="M 120 148 L 148 120" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <path d="M 392 148 L 364 120" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />
  <path d="M 120 364 L 148 392" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />
  <path d="M 392 364 L 364 392" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />

  <!-- Inner Gold Grid Lines -->
  <path d="M 144 200 L 368 200 M 144 312 L 368 312" stroke="#F59E0B" stroke-opacity="0.18" stroke-width="2" />
  <path d="M 200 144 L 200 368 M 312 144 L 312 368" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2" />

  <!-- Central "TXS" Emblem Geometry -->
  <g filter="url(#glow)">
    <!-- 'T' Letterform -->
    <path d="M 152 220 L 236 220 L 236 244 L 206 244 L 206 304 L 182 304 L 182 244 L 152 244 Z" fill="url(#cyan-grad)" />

    <!-- 'X' Letterform (Cross-interlocking) -->
    <path d="M 238 220 L 260 220 L 280 256 L 300 220 L 322 220 L 292 262 L 324 304 L 302 304 L 280 268 L 258 304 L 236 304 L 268 262 Z" fill="#FFFFFF" />

    <!-- 'S' Letterform (Angular cyber styled) -->
    <path d="M 334 220 L 372 220 L 372 242 L 348 242 L 348 254 L 372 260 L 372 304 L 334 304 L 334 282 L 358 282 L 358 270 L 334 264 Z" fill="url(#gold-grad)" />
  </g>

  <!-- Lower Tech Subtitle Badge -->
  <rect x="176" y="342" width="160" height="22" rx="6" fill="#090B10" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />
  <text x="256" y="357" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="900" fill="#38BDF8" letter-spacing="4" text-anchor="middle">TECH OS</text>

  <!-- Status LED Light Node -->
  <circle cx="256" cy="144" r="5" fill="#10B981" filter="url(#glow)" />
</svg>
